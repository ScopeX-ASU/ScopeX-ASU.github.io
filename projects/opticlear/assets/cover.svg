<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">OptiClear project cover</title>
  <desc id="desc">Abstract curvilinear photonic mask pattern with the OptiClear title.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f0f2"/>
      <stop offset="1" stop-color="#ded4da"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8c1d40"/>
      <stop offset="1" stop-color="#3f2732"/>
